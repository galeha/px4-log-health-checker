name: Release Windows portable package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Test, build, and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Release tags must look like v1.2.0 or v1.3.0-beta.1: $env:GITHUB_REF_NAME"
          }

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --requirement requirements-build.txt

      - name: Run source tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build and smoke-test portable application
        shell: pwsh
        run: .\scripts\build_windows.ps1 -SkipTests -PythonPath (Get-Command python).Source

      - name: Create release archive and checksum
        id: package
        shell: pwsh
        run: |
          .\scripts\package_release.ps1 -VersionTag $env:GITHUB_REF_NAME
          $archive = Join-Path $PWD "release\PX4-Log-Health-Checker-${env:GITHUB_REF_NAME}-win64.zip"
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum=$archive.sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $arguments = @(
            'release', 'create', $tag,
            '${{ steps.package.outputs.archive }}',
            '${{ steps.package.outputs.checksum }}',
            '--verify-tag',
            '--generate-notes',
            '--title', "PX4 Log Health Checker $tag"
          )
          if ($tag.Contains('-')) {
            $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Creating GitHub Release failed with exit code $LASTEXITCODE."
          }
